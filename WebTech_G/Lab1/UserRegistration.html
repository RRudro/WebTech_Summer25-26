<!DOCTYPE html>
<html lang ="en-US">
<head>
    <title> User Registration Form </title>
</head>
<body>
    <h1> Patient Registration Form </h1>
    <form>
    <table>

        <tr>
            <td><label for = "patientname"> <b> Patient Name: </b> </label></td>
            <td><input type ="text" id = name name = patientname  placeholder="Enter Yoru Name"></td>
            <td> <br><br> </td>
        </tr>

        <tr>
            <td><label for = "patientphone"> Patient Phone Number:  </label> </td>
            <td><input type ="text" id = phone name = patientphone  placeholder="Enter Yoru Phone Number"> </td>
            <td> <br><br> </td>
        </tr>

        <tr>
        <td> <label for = "patientDOB"> Patient DOB:  </label></td>
        <td> <input type ="date" id = DOB name = patientDOB ></td>  
        <td><br><br> </td>
        </tr>

        

        
        
        

       
        
        <label for = "Gender"> Gender:  </label>
        <input type ="radio" id = male name = male value =Male > Male
        <input type ="radio" id = female name = female value =Female > Female
        <br><br>

        <label for = "patientpass"> Patient Password:  </label>
        <input type ="password" id = password name = patientpass >
        <br><br>

        <label for = "patientemail"> Patient Email:  </label>
        <input type ="email" id = email  name = patientemail>
        <br><br>

        <label for = "patientFile"> Patient Medical Document:  </label>
        <input type ="file" id = file name = patientFile >
        <br><br>

        <input type ="submit" id = submit  name=signup value = Signup>
        
    </table>
        


    </form>
</body>
</html>
